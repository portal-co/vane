[package]
name = "vane"
version.workspace = true #= "0.1.0"
license.workspace = true #= "MPL-2.0"
description.workspace = true #= "Risc-V emulator for the Web, WASM, and anything based on them"

authors = ["Graham Kelly <gkgoat6700@gmail.com>"]
edition = "2018"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["js-host", "console_error_panic_hook"]
# The wasm-bindgen/JS surface (D1 in PLAN_LINUX_WASM.md). Disable for
# `wasm32-wasip1`, WASIX, and native hosts; the plain-Rust twin API is
# always available.
js-host = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
    "dep:os-async",
    "dep:os-ctx",
    "dep:os-unix-emulation",
    "vane-meta-gen/js-host",
]

[dependencies]
wasm-bindgen = { workspace = true, optional = true }
spin.workspace = true
vane-riscv = {path="../vane-riscv",version = "^0.1.0"}
vane-meta-gen = {path = "../vane-meta-gen",version = "^0.1.0", default-features = false}
vane-arch = {path = "../vane-arch",version = "^0.1.0", features = ["async-host"]}
vane-swap = {path = "../vane-swap", version = "^0.1.0"}

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = { version = "0.3.77", optional = true }
rv-asm.workspace = true

paste = "1.0.15"
wasm-bindgen-futures = { version = "0.4.50", optional = true }
os-async = { git = "https://github.com/portal-co/os-emulation.git", optional = true }
os-ctx = { git = "https://github.com/portal-co/os-emulation.git", optional = true }
os-unix-emulation = { git = "https://github.com/portal-co/os-emulation.git", optional = true }


[dev-dependencies]
wasm-bindgen-test = "0.3.34"
elf = "0.8.0"
