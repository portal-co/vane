[package]
name = "vane-riscv"

edition = "2024"
version.workspace = true
license.workspace = true
description.workspace = true

[features]
default = ["target-js", "target-wasm"]
target-js = ["vane-arch/target-js"]
target-wasm = ["vane-arch/target-wasm", "dep:wasmparser"]
# Exposes `rv_emit` (the RV64 `StackOp` trace producer) publicly for the
# differential fuzz harness (`crates/vane-cross-fuzz`). Never enabled by the
# `wasm32` cdylib — the harness is host-only.
fuzz-traces = []
# Nightly `gen` blocks power the lazy, streaming trace emitter
# (`rv_emit_ops`). Off by default so the stable interpreter build (spday's
# plain-Rust twin) compiles the eager worklist fallback in `rv_emit`.
gen-blocks = []

[dependencies]
libm.workspace = true
vane-arch = { path = "../vane-arch", default-features = false }
rv-asm.workspace = true
paste = "1.0.15"
wasmparser = { workspace = true, optional = true }
