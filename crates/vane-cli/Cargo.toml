[package]
name = "vane-cli"
edition = "2024"
version.workspace = true
license.workspace = true
description = "Self-driving vane CLI: loads a RISC-V ELF and runs it under the interpreter with a Linux userspace syscall shim (WASI/WASIX/native host)"
publish = false

[features]
# `js` enables vane's wasm-bindgen surface so the same binary can be smoke-run
# on native dev machines against the exact type JS embedders use. It is off
# for wasm32-wasip1 / WASIX builds (`--no-default-features`).
default = ["js"]
js = ["vane/js-host"]
# `wasix` enables the threaded host-IO path: a background thread pumps stdin
# into the emulated UART (instead of cooperative polling between quanta).
# WASIX supports real threads; the same code also runs on native. There is no
# WASIX-specific API here — threads + channels suffice (PLAN §8 / M7).
wasix = []

[dependencies]
vane = { path = "../vane", default-features = false }
vane-host = { path = "../vane-host" }
futures = { version = "0.3", default-features = false, features = ["executor"] }
vane-swap = { path = "../vane-swap", features = ["std"] }
getrandom = { version = "0.3", default-features = false }
