[package]
name = "vane-swap"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Encrypted paging of vane guest RAM to a backing store (PLAN_LINUX_WASM.md §6)"

[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false }

[features]
default = []
# File-backed swap store (native + wasm32-wasip1, both of which expose a
# std::fs::File). Browser backends (OPFS/IndexedDB) live behind the host
# crate, not here.
std = []

[package.metadata.docs.rs]
no-default-features = true
