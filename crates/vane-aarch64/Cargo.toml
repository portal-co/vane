[package]
name = "vane-aarch64"
edition = "2024"
version.workspace = true
license.workspace = true
description = "AArch64 guest frontend for Vane's StackOp and JavaScript JIT backends"

[features]
default = ["target-js", "target-wasm"]
target-js = ["vane-arch/target-js"]
target-wasm = ["vane-arch/target-wasm"]

[dependencies]
vane-arch = { path = "../vane-arch", default-features = false }
vane-target-core = { path = "../vane-target-core" }
disarm64.workspace = true
os-ctx = { git = "https://github.com/portal-co/os-emulation.git" }
os-host-api = { git = "https://github.com/portal-co/os-emulation.git" }
os-unix-emulation = { git = "https://github.com/portal-co/os-emulation.git" }

[dev-dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-test = "0.3.34"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
