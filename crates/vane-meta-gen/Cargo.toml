[package]
name = "vane-meta-gen"
edition = "2024"
version.workspace = true
license.workspace = true
description.workspace = true

[features]
default = ["js-host"]
# When enabled, the `vane_meta!` macro additionally emits the wasm-bindgen
# surface (getters, `J`/`j`/jit_run, `_sys`, inline-JS helpers). When
# disabled, only the plain-Rust twin is emitted (D1 in PLAN_LINUX_WASM.md).
js-host = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { workspace = true, optional = true }
# No target-wasm: its `gen-blocks` nightly gate must not leak into
# stable-toolchain consumers of the plain-Rust twin (spday).
vane-arch = {path="../vane-arch",version = "^0.1.0", default-features = false, features = ["target-js", "async-host"]}
spin.workspace = true